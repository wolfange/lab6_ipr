apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-aggregator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sales-aggregator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      {{- include "sales-aggregator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sales-aggregator.selectorLabels" . | nindent 8 }}
        {{- range $k, $v := .Values.labels }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
        {{- if .Values.environment }}
        environment: {{ .Values.environment | quote }}
        {{- end }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sales-aggregator-secrets
                  key: database-url
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sales-aggregator-secrets
                  key: django-secret-key
            - name: DJANGO_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: sales-aggregator-config
                  key: DJANGO_DEBUG
            - name: DJANGO_ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: sales-aggregator-config
                  key: DJANGO_ALLOWED_HOSTS
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
