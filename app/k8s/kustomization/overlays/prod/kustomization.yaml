apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sales-prod

bases:
  - ../../base

patches:
  - path: patch-replicas.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: sales-aggregator
  - path: patch-resources.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: sales-aggregator

secretGenerator:
  - name: sales-aggregator-secrets
    literals:
      - database-url=postgresql://postgres:REPLACE_WITH_PASSWORD@postgres-0.postgres.sales-prod.svc.cluster.local:5432/sales_db?sslmode=disable
      - django-secret-key=django-insecure-lab6-prod-secret-key
    options:
      disableNameSuffixHash: true

commonLabels:
  environment: prod
