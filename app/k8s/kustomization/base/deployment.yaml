apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-aggregator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sales-aggregator
  template:
    metadata:
      labels:
        app: sales-aggregator
    spec:
      containers:
        - name: app
          image: sales-aggregator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sales-aggregator-secrets
                  key: database-url
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sales-aggregator-secrets
                  key: django-secret-key
            - name: DJANGO_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: sales-aggregator-config
                  key: DJANGO_DEBUG
            - name: DJANGO_ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: sales-aggregator-config
                  key: DJANGO_ALLOWED_HOSTS
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
